[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filetidy"
version = "0.1.0"
description = "Sort loose files into folders by type -- identically on macOS, Windows and Linux."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "citizen204", email = "cxi9371@outlook.com" }]
keywords = ["files", "organiser", "organizer", "cleanup", "downloads", "desktop"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/citizen204/filetidy"
Issues = "https://github.com/citizen204/filetidy/issues"

[project.scripts]
filetidy = "filetidy.cli:main"

[tool.setuptools.packages.find]
include = ["filetidy*"]
